<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc"><title id="title">Olympia</title><desc id="desc">Escudo de Classic Physique: torso en V, barra con discos y acabado rojo y blanco hueso. Identidad vectorial original.</desc><defs>  <linearGradient id="fire" x1=".1" y1=".9" x2=".85" y2=".05" gradientUnits="objectBoundingBox"><stop stop-color="#E10600"/><stop offset=".5" stop-color="#F22411"/><stop offset="1" stop-color="#FF3B1F"/></linearGradient>
