<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="BLOOD &amp; GUTS. Tu registro personal de entrenamiento, recuperación y progreso, también sin conexión." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>BLOOD &amp; GUTS · Registro personal</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0A0A0A; color: #F1EDE4; }
      .boot-splash { box-sizing: border-box; min-height: 100svh; display: grid; place-content: center; gap: 1.25rem; padding: calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom)); text-align: center; font: 600 .85rem/1.5 sans-serif; letter-spacing: .1em; }
      .boot-splash img { width: 92px; height: 92px; margin: auto; }
      .boot-splash strong { font-size: clamp(1.5rem, 8vw, 2.5rem); line-height: 1; letter-spacing: -.04em; }
      .boot-splash span { color: #A6ABB1; letter-spacing: .15em; }
      .boot-splash i { width: 64px; height: 3px; margin: auto; background: #C8102E; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" role="status" aria-label="Cargando entrenamiento"><img src="./icon.svg" alt="" width="92" height="92" /><strong>BLOOD &amp; GUTS</strong><span>PREPARANDO TU ENTRENAMIENTO</span><i aria-hidden="true"></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
