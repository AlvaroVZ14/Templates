<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="description" content="Olympia amigos. Tu registro privado de entrenamiento, recuperación y progreso, también sin conexión." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Olympia" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Olympia · Registro personal</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0B0B0D; color: #F2F0EB; }
      .boot-splash { box-sizing: border-box; min-height: 100svh; display: grid; place-content: center; gap: 1.25rem; padding: calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom)); text-align: center; font: 600 .85rem/1.5 sans-serif; letter-spacing: .1em; }
      .boot-splash .splash-brand { position:relative;overflow:hidden;width:min(66vw,270px);margin:auto; }
      .boot-splash img { display:block;width:100%;height:auto;aspect-ratio:900/800; }
      .splash-brand::after { content:'';position:absolute;inset:-100% -60%;background:linear-gradient(110deg,transparent 46%,#F2F0EB22 49%,#F2F0EB66 50%,transparent 54%);opacity:0;transform:translateX(-50%);animation:boot-shine 180ms ease-out 80ms!important;pointer-events:none; }
      @keyframes boot-shine { 0%{transform:translateX(-50%);opacity:0}35%{opacity:.8}100%{transform:translateX(50%);opacity:0} }
      @media(prefers-reduced-motion:reduce) { .splash-brand::after{animation:none!important;display:none} }
      .boot-splash strong { font-size: clamp(1.5rem, 8vw, 2.5rem); line-height: 1; letter-spacing: -.04em; }
      .boot-splash span { color: #A6ABB1; letter-spacing: .15em; }
      .boot-splash i { width: 64px; height: 2px; margin: auto; background: #E10600; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" role="status" aria-label="Cargando Olympia"><div class="splash-brand"><img src="./logo.svg" alt="Olympia" width="900" height="800" /></div><span>PREPARANDO TU ENTRENAMIENTO</span><i aria-hidden="true"></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
